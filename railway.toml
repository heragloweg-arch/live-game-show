[build]
builder = "nixpacks"
buildCommand = "npm ci --legacy-peer-deps && npm run typecheck && npm run lint && npm test -- --run && npm run build && node scripts/verify-production.mjs"

[deploy]
startCommand = "node scripts/write-runtime-config.mjs && node scripts/static-server.mjs"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
