name: Qaddaha CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qaddaha-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality-gates:
    name: Typecheck, lint, tests, build, release configuration, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest suite
        run: npm test

      - name: Production web build
        run: npm run build

      - name: Static launch configuration gate
        env:
          LAUNCH_GATE: static
        run: node scripts/verify-launch-config.mjs

      - name: Content release gate
        run: node scripts/verify-content-release.mjs

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

  supabase-edge-typecheck:
    name: Supabase Edge Function typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Edge Function entrypoints
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/functions/*/index.ts)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Supabase Edge Function entrypoints found" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "::group::deno check $file"
            deno check "$file"
            echo "::endgroup::"
          done

      - name: Run answer validation regression tests
        run: deno test supabase/functions/_shared/answerValidator_test.ts
