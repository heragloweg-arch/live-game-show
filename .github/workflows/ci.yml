name: Qaddaha CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qaddaha-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality-gates:
    name: Typecheck, lint, tests, build, release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest suite
        run: npm test

      - name: Production web build
        run: npm run build

      - name: Static launch configuration gate
        env:
          LAUNCH_GATE: static
        run: node scripts/verify-launch-config.mjs

      - name: Content release gate
        run: node scripts/verify-content-release.mjs
